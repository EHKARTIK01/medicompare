server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: medicompare-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medicompare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    # open-in-view is left at Spring Boot's default (true) so lazy associations on entities
    # returned directly from a few simple admin endpoints (e.g. Doctor, HospitalService) can
    # still serialize correctly. Bidirectional collections are @JsonIgnore'd on the entities
    # to prevent infinite recursion; see Hospital/User entities.
    defer-datasource-initialization: true   # ensures Hibernate creates tables before data.sql runs

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}   # set to 'always' on first run to load data.sql demo data

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_MIN_256_BITS_IN_ENV}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}      # 1 hour
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@medicompare.demo}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  mock-mode: ${RAZORPAY_MOCK_MODE:true}   # true = simulated payments for dev/demo, no real credentials needed

google:
  maps:
    server-api-key: ${GOOGLE_MAPS_SERVER_API_KEY:}

logging:
  level:
    root: INFO
    com.medicompare: ${LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
