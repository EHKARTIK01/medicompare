# Local dev/demo stack: MySQL + Redis + backend + frontend.
# Copy backend/.env.example to a real .env before running, or export the
# variables another way. Never commit real secrets.
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_DATABASE: medicompare
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      DB_URL: jdbc:mysql://mysql:3306/medicompare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret}
      RAZORPAY_MOCK_MODE: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SQL_INIT_MODE: always
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
